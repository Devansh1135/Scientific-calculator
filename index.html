<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Scientific Calculator</title>
</head>

<body>
    <div class="container" id="box">

        <div id="display" class="mt-2 mb-2">
            <input class="form-control" id="displayText" type="textarea"></input>
        </div>

        <div class="row mb-2 g-1 top functions">
            <div class="col-2" id="toggleMode">DEG</div>
            <div class="col-2">F-E</div>
        </div>

        <div class="row mb-2 g-1 top">
            <div class="col">MC</div>
            <div class="col">MR</div>
            <div class="col">M+</div>
            <div class="col">M-</div>
            <div class="col">MS</div>
        </div>

        <div class="row mb-2 g-1 top functions">
            <div class="col-4">Trigonometry</div>
            <div class="col-4">Function</div>
        </div>

        <div class="row mb-2 g-1 top">
            <div class="col">2 <sup>nd</sup></div>
            <div class="col" data-value="pi">π</div>
            <div class="col" data-value="e">e</div>
            <div class="col" data-action="clear">C</div>
            <div class="col" data-action="backspace">&#9003;</div>
        </div>

        <div class="row mb-2 g-1 top">
            <div class="col" data-value="^2">x <sup>2</sup></div>
            <div class="col" data-value="1/">1/x</div>
            <div class="col" data-value="abs("> |x|</div>
            <div class="col" data-value="exp(">exp</div>
            <div class="col" data-value="%">mod</div>
        </div>

        <div class="row mb-2 g-1 top">
            <div class="col" data-value="sqrt("> <sup>2</sup>&#8730;x</div>
            <div class="col" data-value="(">(</div>
            <div class="col" data-value=")">)</div>
            <div class="col" data-value="!">n!</div>
            <div class="col" data-value="/">&divide;</div>
        </div>

        <div class="row mb-2 g-1">
            <div class="col" data-value="^">x <sup>y</sup></div>
            <div class="col" data-value="7"><strong>7</strong></div>
            <div class="col" data-value="8"><strong>8</strong></div>
            <div class="col" data-value="9"><strong>9</strong></div>
            <div class="col" data-value="*">X</div>
        </div>

        <div class="row mb-2 g-1">
            <div class="col" data-value="10^(">10 <sup>x</sup></div>
            <div class="col" data-value="4"><strong>4</strong></div>
            <div class="col" data-value="5"><strong>5</strong></div>
            <div class="col" data-value="6"><strong>6</strong></div>
            <div class="col" data-value="-">-</div>
        </div>


        <div class="row mb-2 g-1">
            <div class="col" data-value="log(">log</div>
            <div class="col" data-value="1"><strong>1</strong></div>
            <div class="col" data-value="2"><strong>2</strong></div>
            <div class="col" data-value="3"><strong>3</strong></div>
            <div class="col" data-value="+">+</div>
        </div>

        <div class="row mb-2 g-1">
            <div class="col" data-value="ln(">ln</div>
            <div class="col" data-action="negate">+/-</div>
            <div class="col" data-value="0"><strong>0</strong></div>
            <div class="col" data-value=".">.</div>
            <div class="col" id="submit" data-action="equals">=</div>
        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.11.0/math.min.js"></script>

    <script src="evaluate.js"></script>

</body>

</html>
